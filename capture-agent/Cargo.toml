[package]
name = "capture-agent"
version = "0.1.0"
edition = "2021"

[lib]
name = "capture_agent"
path = "src/lib.rs"

[[bin]]
name = "capture-agent"
path = "src/main.rs"

[dependencies]
pcap = "2.5"
etherparse = "0.20"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
etherparse = { version = "0.20", features = ["std"] }
