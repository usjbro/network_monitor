[package]
name = "capture-agent"
version = "0.1.0"
edition = "2021"

[lib]
name = "capture_agent"
path = "src/lib.rs"

[[bin]]
name = "capture-agent"
path = "src/main.rs"

[dependencies]
pcap = "2.5"
etherparse = "0.20"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "macros", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
md5 = "0.8.1"
libc = "0.2.189"
hex = "0.4.3"
ring = "0.17.14"
zeroize = "1.9.0"
fluke-hpack = "0.3.1"
base64 = "0.23.1"

[dev-dependencies]
etherparse = { version = "0.20", features = ["std"] }

[patch.crates-io]
# fluke-hpack 0.3.1's update_max_dynamic_size() panics (`.ok().unwrap()`)
# on a malformed/truncated dynamic-table-size-update encoding, reachable
# straight from attacker-controlled decrypted TLS bytes via http2.rs's
# HEADERS-frame handling. Found by this repo's own fuzzing (issue #66);
# see vendor/fluke-hpack/src/decoder.rs for the one-line fix. No newer
# crates.io release exists (0.3.1 is current as of writing) and upstream
# is the "historically-unmaintained" crate http2.rs already calls out, so
# this vendors a locally-patched copy rather than waiting on a release.
fluke-hpack = { path = "vendor/fluke-hpack" }
