name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    name: Rust (capture-agent)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: capture-agent
    steps:
      - uses: actions/checkout@v4

      - name: Install libpcap
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry and build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-audit
            ~/.cargo/advisory-db
            capture-agent/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('capture-agent/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build
        run: cargo build --release --locked

      - name: Test
        run: cargo test --locked

      - name: Clippy (warnings deny)
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Install cargo-audit
        run: command -v cargo-audit || cargo install cargo-audit --locked

      - name: Audit dependencies (RustSec advisory-db)
        run: cargo audit --db ~/.cargo/advisory-db

  fuzz:
    name: Fuzz targets (capture-agent)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: capture-agent
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the path filter below can diff a PR's head
          # against its actual merge-base, not just the checked-out tip.
          fetch-depth: 0

      - name: Decide whether this run needs to fuzz
        id: filter
        run: |
          # Issue #66: fuzzing is slow (2 x 30s per run, plus a nightly
          # toolchain + cargo-fuzz install) relative to the rest of CI, so
          # an ordinary PR only pays that cost when it touches the two
          # files these targets actually cover or the fuzz harness itself.
          # Every push to main always fuzzes regardless of paths, so a
          # regression can never land unobserved via an unrelated path
          # (e.g. a dependency bump, like this same issue's own fix).
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run_fuzz=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          merge_base="$(git merge-base ${{ github.event.pull_request.base.sha }} ${{ github.sha }})"
          changed="$(git diff --name-only "$merge_base" ${{ github.sha }})"
          echo "Changed files vs merge-base:"
          echo "$changed"
          if echo "$changed" | grep -qE '^capture-agent/(src/parse\.rs|src/http2\.rs|fuzz/)'; then
            echo "run_fuzz=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_fuzz=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install libpcap
        if: steps.filter.outputs.run_fuzz == 'true'
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev

      - name: Install nightly Rust toolchain
        if: steps.filter.outputs.run_fuzz == 'true'
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo registry and fuzz build output
        if: steps.filter.outputs.run_fuzz == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-fuzz
            capture-agent/fuzz/target
          key: ${{ runner.os }}-fuzz-${{ hashFiles('capture-agent/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-fuzz-

      - name: Install cargo-fuzz
        if: steps.filter.outputs.run_fuzz == 'true'
        run: command -v cargo-fuzz || cargo install cargo-fuzz --locked

      - name: Fuzz parse_packet
        if: steps.filter.outputs.run_fuzz == 'true'
        run: cargo +nightly fuzz run parse_packet -- -max_total_time=30

      - name: Fuzz http2_reassembly
        if: steps.filter.outputs.run_fuzz == 'true'
        run: cargo +nightly fuzz run http2_reassembly -- -max_total_time=30

      - name: Upload crash artifacts
        if: failure() && steps.filter.outputs.run_fuzz == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crash-artifacts
          path: capture-agent/fuzz/artifacts/
          if-no-files-found: ignore

  web:
    name: Web (Next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies (npm advisory database)
        run: npm audit --audit-level=high

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npx vitest run

      - name: Build
        run: npm run build

  e2e:
    name: E2E smoke test (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        # GitHub-hosted runners have no pre-installed browser (unlike this
        # repo's own dev sandbox, which points playwright.config.ts at a
        # fixed local path instead) — fetch the exact revision this pinned
        # @playwright/test version expects. --with-deps only on a cache
        # miss: the OS-level dependencies it installs aren't cached, but
        # they're already present on this image after the first run within
        # a cache-key's lifetime pulled the browser itself.
        run: npx playwright install --with-deps chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
      - name: Install Playwright Chromium (browser only, deps already present)
        run: npx playwright install chromium
        if: steps.playwright-cache.outputs.cache-hit == 'true'

      - name: Run Playwright smoke test
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
